name: API Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Start test server
        run: npm run start:test > app.log 2>&1 &
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          SECRET: test_secret_not_for_production
          PORT: 3001
      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat app.log
          exit 1
      - run: npm test
      - name: Application logs on failure
        if: failure()
        run: cat app.log
